name: Configurator

on:
  push:
    branches: [ main, ci ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: MTEngineSDLTemplateApp }
      - name: Clone engine beside the template
        run: |
          REF="$(grep -v '^[[:space:]]*#' MTEngineSDLTemplateApp/MTENGINE_REF | grep -v '^[[:space:]]*$' | head -1)"
          git clone https://github.com/slajerek/MTEngineSDL.git MTEngineSDL
          git -C MTEngineSDL checkout "${REF#origin/}" 2>/dev/null || git -C MTEngineSDL checkout --detach "$REF"
      # Not the image's python: on ubuntu-24.04 `pip install` into it is refused
      # (PEP 668, externally-managed-environment). setup-python's interpreter
      # takes packages.
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python3 -m pip install Pillow
      - run: cd MTEngineSDLTemplateApp/tests/configure && python3 -m unittest discover -v

  generate-and-build:
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        preset:
          - { name: CiDefault, args: "" }
          - { name: CiHybrid, args: "--menu hybrid --caps MIDI,GAMEPADS --locales en,pl" }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with: { path: MTEngineSDLTemplateApp }
      - name: Clone engine beside the template
        run: |
          REF="$(grep -v '^[[:space:]]*#' MTEngineSDLTemplateApp/MTENGINE_REF | grep -v '^[[:space:]]*$' | head -1)"
          git clone https://github.com/slajerek/MTEngineSDL.git MTEngineSDL
          git -C MTEngineSDL checkout "${REF#origin/}" 2>/dev/null || git -C MTEngineSDL checkout --detach "$REF"
      - name: Generate
        # `python3` is not a reliable name on the Windows images, so
        # fall back to `py -3` there.
        run: |
          if command -v python3 >/dev/null && python3 -c 'import sys' 2>/dev/null; then PY=python3; else PY="py -3"; fi
          $PY MTEngineSDLTemplateApp/configure.py ${{ matrix.preset.name }} --yes ${{ matrix.preset.args }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake nasm xvfb git pkg-config libglew-dev libgtk-3-dev \
            libgl1-mesa-dev libglu1-mesa-dev libasound2-dev libpulse-dev libx11-dev libxext-dev \
            libxrandr-dev libxcursor-dev libxi-dev libxinerama-dev libwayland-dev libxkbcommon-dev \
            libxss-dev libxcb1-dev libsndio-dev libfreetype-dev libdbus-1-dev libglib2.0-dev zlib1g-dev
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew list nasm >/dev/null 2>&1 || brew install nasm
      - name: MSYS2 prerequisites for the codec builds
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $msys2 = if ($env:MSYS2_ROOT) { $env:MSYS2_ROOT } else { 'C:\msys64' }
          $make  = Join-Path $msys2 'usr\bin\make.exe'
          if (-not (Test-Path (Join-Path $msys2 'usr\bin\bash.exe'))) { throw "MSYS2 not found at $msys2" }
          if (-not (Test-Path $make)) { & (Join-Path $msys2 'usr\bin\pacman.exe') -Sy --needed --noconfirm make diffutils pkgconf }
          if (-not (Test-Path $make)) { throw "MSYS2's make is still missing at $make after pacman ran." }
      - name: Build and test (Linux)
        if: runner.os == 'Linux'
        working-directory: ${{ matrix.preset.name }}
        run: ./build-linux.sh && xvfb-run -a ./tests/run_test.sh --binary build/${{ matrix.preset.name }}
      - name: Build and test (macOS)
        if: runner.os == 'macOS'
        working-directory: ${{ matrix.preset.name }}
        run: ./build-macos.sh && ./tests/run_test.sh --skip-build
      - name: Build and test (Windows)
        if: runner.os == 'Windows'
        working-directory: ${{ matrix.preset.name }}
        shell: pwsh
        run: |
          .\build-windows.ps1
          if ($LASTEXITCODE -ne 0) { throw "build failed" }
          bash ./tests/run_test.sh --binary 'platform/Windows/bin/x64/Release/${{ matrix.preset.name }}.exe'
