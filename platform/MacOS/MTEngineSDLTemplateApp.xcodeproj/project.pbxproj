		AABBCCDD2699999900CC0002 /* Embed FFmpeg dylibs */ = {
			isa = PBXShellScriptBuildPhase;
			alwaysOutOfDate = 1;
			buildActionMask = 2147483647;
			files = (
			);
			inputFileListPaths = (
			);
			inputPaths = (
			);
			name = "Embed FFmpeg dylibs";
			outputFileListPaths = (
			);
			outputPaths = (
			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/bash;
			shellScript = "# THE CAPABILITY GATE. With MT_CAP_VIDEO_PLAYBACK=0 the codec script builds no\n# dylibs at all, and the loop below would then fail the build looking for them.\n# Absent means ON, matching the capability default and OTHER_LDFLAGS above.\nif [ \"${MT_ENABLE_FFMPEG:-1}\" = \"0\" ]; then\n    # REMOVE any dylibs a previous FFmpeg-ON build left here, do not just\n    # skip. Contents/Frameworks is never cleaned between builds and\n    # MT_CAPS_LIBS_DIR does not change when only the flag flips, so an\n    # incremental build into the same DerivedData kept shipping five LGPL\n    # dylibs the binary no longer links -- measured 2026-09-10, 9 files\n    # still in the bundle after a clean MT_ENABLE_FFMPEG=0 build that had\n    # correctly skipped the embed. An app store submission is the one\n    # place that must not carry them.\n    DEST=\"$BUILT_PRODUCTS_DIR/$FRAMEWORKS_FOLDER_PATH\"\n    if [ -d \"$DEST\" ]; then\n        for lib in libavutil libavcodec libavformat libswscale libswresample; do\n            rm -f \"$DEST/$lib\".*.dylib \"$DEST/$lib.dylib\"\n        done\n    fi\n    echo \"MT_ENABLE_FFMPEG=0: no FFmpeg dylibs embedded; any stale ones removed\"\n    exit 0\nfi\n\n# FFmpeg is the one engine dependency that is NOT folded into a static\n# archive -- shipping it as a dylib is what discharges the LGPL obligation --\n# so a target that pulls in CVideoSourceFFmpeg has to carry the five dylibs\n# inside the bundle.\n#\n# A SCRIPT, not a Copy Files phase, and that is deliberate: a Copy Files phase\n# needs PBXFileReferences, and a file reference is a fixed path. These files\n# live under $MT_CAPS_LIBS_DIR, which is keyed by the resolved capability set\n# and therefore has no path this project can name. Same reason the archives\n# are reached with -l against a search path rather than by reference.\nset -euo pipefail\n\nif [ -z \"${MT_CAPS_LIBS_DIR:-}\" ]; then\n    echo \"error: MT_CAPS_LIBS_DIR is empty -- build through build-macos.sh or the scheme's pre-action\" >&2\n    exit 1\nfi\n\nDEST=\"$BUILT_PRODUCTS_DIR/$FRAMEWORKS_FOLDER_PATH\"\nmkdir -p \"$DEST\"\n\n# -R keeps the SONAME symlink a symlink. The install names were normalised to\n# @rpath/<soname> when the dylibs were built, so that link is what a consumer\n# actually resolves; flattening it would double the shipped bytes.\nfor lib in libavutil libavcodec libavformat libswscale libswresample; do\n    found=0\n    for f in \"$MT_CAPS_LIBS_DIR/$lib\".*.dylib \"$MT_CAPS_LIBS_DIR/$lib.dylib\"; do\n        [ -e \"$f\" ] || continue\n        cp -R -f \"$f\" \"$DEST/\"\n        found=1\n    done\n    if [ \"$found\" -eq 0 ]; then\n        echo \"error: $lib not staged in $MT_CAPS_LIBS_DIR -- run build-video_codecs.sh\" >&2\n        exit 1\n    fi\ndone\n\n# Re-sign what we just copied in. The bundle was signed before this phase ran,\n# and an unsigned dylib inside a signed bundle fails at load. Ad-hoc matches\n# what build-macos.sh passes for CODE_SIGN_IDENTITY.\nif [ \"${CODE_SIGNING_ALLOWED:-YES}\" != \"NO\" ]; then\n    for f in \"$DEST\"/*.dylib; do\n        [ -f \"$f\" ] || continue\n        codesign --force --sign \"${EXPANDED_CODE_SIGN_IDENTITY:--}\" \"$f\" >/dev/null 2>&1 || true\n    done\nfi\n";
		};
